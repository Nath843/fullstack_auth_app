<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:black;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* LOGIN BOX */
form{
  position:relative;
  z-index:2;
  width:270px;
  padding:25px;
  background:rgba(0,0,0,0.6);
  border:1px solid #0ff;
  box-shadow:0 0 15px #0ff, 0 0 30px #f0f;
  color:#0ff;
  text-align:center;
}

input{
  width:200px;
  margin:5px 0 15px 0;
  padding:5px;
}

button{
  padding:5px 10px;
}

/* TWINKLE STARS */
.star{
  position:absolute;
  color:gold;
  font-size:20px;
  animation:twinkle 2s infinite;
}

@keyframes twinkle{
  0%{opacity:0.2; transform:scale(0.8);}
  50%{opacity:1; transform:scale(1.3);}
  100%{opacity:0.2; transform:scale(0.8);}
}

/* FIREWORK PARTICLES */
.particle{
  position:absolute;
  color:white;
  animation:burst 1.5s infinite;
}

@keyframes burst{
  0%{transform:translate(0,0); opacity:1;}
  100%{transform:translate(var(--x), var(--y)); opacity:0;}
}
h2{
  color:#f0f;
  text-shadow:0 0 10px #f0f, 0 0 20px #0ff;
  animation:flicker 2s infinite;
}

</style>
</head>

<body>

<!-- STARS -->
<div class="star" style="top:10%; left:15%;">★</div>
<div class="star" style="top:20%; left:80%; animation-delay:1s;">★</div>
<div class="star" style="top:70%; left:25%; animation-delay:0.5s;">★</div>
<div class="star" style="top:60%; left:70%; animation-delay:1.5s;">★</div>

<!-- FIREWORK -->
<div class="particle" style="--x:80px; --y:0px; top:30%; left:50%;">✦</div>
<div class="particle" style="--x:-80px; --y:0px; top:30%; left:50%;">✦</div>
<div class="particle" style="--x:0px; --y:80px; top:30%; left:50%;">✦</div>
<div class="particle" style="--x:0px; --y:-80px; top:30%; left:50%;">✦</div>

<!-- LOGIN FORM -->
<form>
  <h2>Login</h2>

  <label>Email</label><br>
  <input type="email" placeholder="Enter email"><br>

  <label>Password</label><br>
  <input type="password" placeholder="Enter password"><br>

  <button>Login</button>
  <button type="submit"><a href="register.html">Register</a></button>
</form>

</body>
</html>
