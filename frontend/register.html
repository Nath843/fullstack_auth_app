<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>

  <style>
    body {
      font-family: Arial;
      margin-top: 80px;
      text-align: center;
      background: linear-gradient(#b0bae7,#c58fb5);
    }

    form {
      border: 1px solid black;
      width: 280px;
      margin: auto;
      padding: 20px;
      background: linear-gradient(135deg,#b17d7d,#7da7b1);
      border-radius: 15%;
    }

    input {
      width: 220px;
      padding: 5px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    button {
      padding: 5px 10px;
    }

    /* TWINKLE STARS */
    .star{
    position:absolute;
    color:gold;
    font-size:20px;
    animation:twinkle 2s infinite;
    }

    @keyframes twinkle{
    0%{opacity:0.2; transform:scale(0.8);}
    50%{opacity:1; transform:scale(1.3);}
    100%{opacity:0.2; transform:scale(0.8);}
    }

  </style>
</head>

<body>

  <form>
    <h2>Register</h2>

    <!-- STARS -->
    <div class="star" style="top:10%; left:15%;">★</div>
    <div class="star" style="top:20%; left:80%; animation-delay:1s;">★</div>
    <div class="star" style="top:70%; left:25%; animation-delay:0.5s;">★</div>
    <div class="star" style="top:60%; left:70%; animation-delay:1.5s;">★</div>

    <label for="name">Name</label>
    <br>
    <input type="text" id="name">

    <br>

    <label for="email">Email</label>
    <br>
    <input type="email" id="email">

    <br>

    <label for="password">Password</label>
    <br>
    <input type="password" id="password">

    <br>

    <label for="phone">Phone Number</label>
    <br>
    <input type="tel" id="phone">

    <br>

    <button type="submit">Register</button>
    <button type="submit"><a href="login.html">Login</a></button>

</body>
</html>
